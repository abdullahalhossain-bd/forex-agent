# pytest.ini — Automated Testing Configuration
# ============================================================
# Run all tests:        pytest
# Run unit only:        pytest tests/unit
# Run with coverage:    pytest --cov=. --cov-report=term-missing
# Verbose:              pytest -v
# Fast smoke test:      pytest -m "smoke"
# ============================================================

[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers (declare so -m doesn't warn)
markers =
    smoke: minimal smoke tests — fast, run on every commit
    unit: pure unit tests — no network, no DB, no file IO
    integration: integration tests — may touch DB/files, never live APIs
    e2e: end-to-end tests — full pipeline, may be slow
    slow: tests that take >2s — skipped in CI fast lane
    requires_network: tests that hit the real internet (excluded by default)

# Default filter: skip tests that need real network unless explicitly requested
addopts =
    -ra
    --strict-markers
    --tb=short
    -m "not requires_network and not slow"

# Minimum version
minversion = 7.0

# Logging — capture with -s to see prints
log_cli = false
log_cli_level = WARNING
log_level = INFO
